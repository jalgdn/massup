  /*
    3 couches selon les specs WWDC 2025 :
      1. illumination  : highlight sur les bords (linear-gradient border)
      2. matériau      : backdrop-filter blur + saturate (vrai effet verre)
      3. shadow/depth  : box-shadow inset doux + drop-shadow extérieur
  */
  .liquid-glass {
    position: relative;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.04) 100%);

    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;

  }
  .liquid-glass::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;

/* ============================================================
   HELPERS
============================================================ */
const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};

const seededRandom = (seed) => {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return () => { h = (h * 16807) % 2147483647; return h / 2147483647; };
};

const calcMacros = (profile) => {
  const { sex, age, weight, height, activity, goalSurplus } = profile;
  const bmr = sex === 'M'
    ? 10 * weight + 6.25 * height - 5 * age + 5
    : 10 * weight + 6.25 * height - 5 * age - 161;
  const factor = ACTIVITY_LEVELS.find(a => a.id === activity)?.factor || 1.55;
  const tdee = bmr * factor;
  const target = Math.round(tdee + (goalSurplus || 400));
  const protein = Math.round(weight * 2);
  const fat = Math.round(weight * 1);
  const carbs = Math.round((target - protein * 4 - fat * 9) / 4);
  return { kcal: target, p: protein, c: carbs, f: fat, bmr: Math.round(bmr), tdee: Math.round(tdee) };
};

const filterRecipes = (profile) => {
  const blockedAllergens = (profile.allergies || [])
    .map(id => ALLERGEN_OPTIONS.find(a => a.id === id))
    .filter(Boolean)
    .flatMap(a => a.match.map(s => s.toLowerCase()));
  return RECIPE_POOL.filter(r => {
    const text = r.ingredients.map(i => i[0].toLowerCase()).join(' ');
    if (blockedAllergens.some(b => text.includes(b))) return false;
    if (profile.diet === 'vegetarian' && /poulet|bœuf|jambon|bacon|lardons|saumon|poisson/i.test(text)) return false;
    if (profile.diet === 'vegan' && /poulet|bœuf|jambon|bacon|lardons|saumon|œuf|fromage|lait|beurre|mozza|cheddar|whey|miel|yaourt/i.test(text)) return false;
    if (profile.diet === 'pescetarian' && /poulet|bœuf|jambon|bacon|lardons/i.test(text)) return false;
    return true;
  });
};

const pickDailyRecipes = (profile, dateKey) => {
  const candidates = filterRecipes(profile);
  const rand = seededRandom(dateKey + (profile.weight || ''));
  const pickFromMeal = (meal, n=1) => {
    const pool = candidates.filter(r => r.meal === meal);
    const picked = [];
    const used = new Set();
    while (picked.length < n && picked.length < pool.length) {
      const idx = Math.floor(rand() * pool.length);
      if (!used.has(idx)) { used.add(idx); picked.push(pool[idx]); }
    }
    return picked;
  };
  return [
    ...pickFromMeal('breakfast', 1),
    ...pickFromMeal('lunch', 1),
    ...pickFromMeal('snack', 1),
    ...pickFromMeal('dinner', 1),
  ];
};

/* ============================================================
   STORAGE HOOK
============================================================ */
const useStored = (key, initial) => {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : initial; }
    catch { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }, [key, val]);
  return [val, setVal];
};

/* ============================================================
   STEPPER — input numérique précis (remplace les sliders)
   Hoisted (hors composant) → pas de re-mount au keystroke.
============================================================ */
const Stepper = ({ label, unit, value, onChange, min=0, max=999, step=1, decimals=0 }) => {
  const inputRef = useRef(null);
  const fmt = (v) => decimals === 0 ? String(Math.round(v)) : v.toFixed(decimals);
  const clamp = (v) => Math.min(max, Math.max(min, v));
  const dec = () => onChange(clamp(Number(value) - step));
  const inc = () => onChange(clamp(Number(value) + step));
  const onInput = (e) => {
    const raw = e.target.value.replace(',', '.');
    if (raw === '' || raw === '.') { onChange(min); return; }
    const n = parseFloat(raw);
    if (!isNaN(n)) onChange(clamp(n));
  };
  return (
    <div className="mb-5">
      <div className="flex justify-between items-baseline mb-2">
        <span className="text-slate-400 text-sm font-medium">{label}</span>
        <span className="text-slate-500 text-xs">{unit}</span>
      </div>
      <div className="flex items-stretch gap-2">
        <button
          type="button" onClick={dec}
          className="w-14 h-14 rounded-2xl bg-white/5 active:bg-white/10 text-white text-2xl font-light border border-white/10 flex items-center justify-center select-none"
          style={{ WebkitTapHighlightColor: 'transparent' }}
        >−</button>
        <div className="flex-1 relative">
          <input
            ref={inputRef}
            type="text" inputMode="decimal" pattern="[0-9.,]*"
            value={fmt(value)}
            onChange={onInput}
            onFocus={(e) => e.target.select()}
            className="w-full h-14 bg-white/5 border border-white/10 rounded-2xl text-center text-2xl font-bold text-white outline-none focus:border-orange-400/60 focus:bg-white/8"
          />
        </div>
        <button
          type="button" onClick={inc}
          className="w-14 h-14 rounded-2xl bg-white/5 active:bg-white/10 text-white text-2xl font-light border border-white/10 flex items-center justify-center select-none"
          style={{ WebkitTapHighlightColor: 'transparent' }}
        >+</button>
      </div>
    </div>
  );
};

const App = () => {
  const [profile, setProfile] = useStored('massup_profile', null);
  const [tab, setTab] = useState('today');
  const [consumed, setConsumed] = useStored('massup_consumed', {});
  const [shoppingChecked, setShoppingChecked] = useStored('massup_shopping_checked', {});
  const [dailyOverride, setDailyOverride] = useStored('massup_daily', {});
  const [apiKey, setApiKey] = useStored('massup_api_key', '');

  if (!profile) return <Onboarding onComplete={setProfile} />;

  const date = todayKey();
  const recipes = dailyOverride[date] || pickDailyRecipes(profile, date);
  const eaten = consumed[date] || [];

  const dailyTotals = recipes
    .filter(r => eaten.includes(r.id))
    .reduce((acc, r) => ({
      kcal: acc.kcal + r.kcal, p: acc.p + r.p, c: acc.c + r.c, f: acc.f + r.f
    }), { kcal: 0, p: 0, c: 0, f: 0 });

  const dailyCost = recipes.reduce((s, r) => s + costOf(r), 0);

  const toggleEaten = (id) => {
    const arr = consumed[date] || [];
    const next = arr.includes(id) ? arr.filter(x => x !== id) : [...arr, id];
    setConsumed({ ...consumed, [date]: next });
  };

  const regenerate = () => {
    const seed = `${date}-${Date.now()}`;
    setDailyOverride({ ...dailyOverride, [date]: pickDailyRecipes(profile, seed) });
  };

  return (
    <div className="min-h-screen flex flex-col">
      <div className="flex-1 pb-28">
        <div key={tab} className="tab-swap">
          {tab === 'today' && <TodayTab profile={profile} recipes={recipes} eaten={eaten} dailyTotals={dailyTotals} dailyCost={dailyCost} toggleEaten={toggleEaten} regenerate={regenerate} />}
          {tab === 'macros' && <MacrosTab profile={profile} consumed={consumed} dailyOverride={dailyOverride} />}
          {tab === 'shop' && <ShoppingTab profile={profile} dailyOverride={dailyOverride} shoppingChecked={shoppingChecked} setShoppingChecked={setShoppingChecked} />}
          {tab === 'profile' && <ProfileTab profile={profile} setProfile={setProfile} apiKey={apiKey} setApiKey={setApiKey} />}
        </div>
      </div>
      <TabBar tab={tab} setTab={setTab} />
    </div>
  );
};

const MacrosTab = ({ profile, consumed, dailyOverride }) => {
  const goal = profile.macros;
  const days = useMemo(() => {
    const arr = [];
    const now = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now); d.setDate(d.getDate() - i);
      const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const recipes = dailyOverride[k] || pickDailyRecipes(profile, k);
      const eaten = consumed[k] || [];
      const totals = recipes.filter(r => eaten.includes(r.id)).reduce((a,r) => ({
        kcal: a.kcal + r.kcal, p: a.p + r.p, c: a.c + r.c, f: a.f + r.f
      }), { kcal:0, p:0, c:0, f:0 });
      arr.push({ key: k, day: ['D','L','M','M','J','V','S'][d.getDay()], totals });
    }
    return arr;
  }, [profile, consumed, dailyOverride]);

  const max = Math.max(goal.kcal, ...days.map(d => d.totals.kcal));
  const avg = Math.round(days.reduce((s,d) => s + d.totals.kcal, 0) / days.length);

  return (
    <div>
      <div className="px-5 pt-8 pb-4">
        <h1 className="text-3xl font-black text-white tracking-tight">Suivi macros</h1>
        <p className="text-slate-400 text-sm">7 derniers jours</p>
      </div>

      <div className="mx-5 mb-5 bg-white/5 border border-white/10 rounded-3xl p-5">
        <div className="flex justify-between items-end mb-4">
          <div>
            <div className="text-xs text-slate-400">Moyenne 7j</div>
            <div className="text-2xl font-black text-white tracking-tight">{avg} <span className="text-sm text-slate-500 font-medium">/ {goal.kcal} kcal</span></div>
          </div>
          <div className={`text-sm font-semibold ${avg >= goal.kcal * 0.95 ? 'text-emerald-400' : 'text-amber-400'}`}>
            {avg >= goal.kcal * 0.95 ? '✓ Sur la bonne voie' : '⚠ En dessous'}
          </div>
        </div>
        <div className="flex items-end justify-between h-40 gap-2">
          {days.map(d => {
            const h = max ? (d.totals.kcal / max) * 100 : 0;
            const reached = d.totals.kcal >= goal.kcal * 0.9;
            return (
              <div key={d.key} className="flex-1 flex flex-col items-center gap-2">
                <div className="text-[10px] text-slate-500 font-semibold">{d.totals.kcal || ''}</div>
                <div className="w-full bg-black/30 rounded-lg overflow-hidden flex flex-col justify-end" style={{height: '100%'}}>
                  <div className={`w-full transition-all ${reached ? 'bg-gradient-to-t from-emerald-500 to-emerald-300' : 'bg-gradient-to-t from-orange-500 to-amber-300'}`} style={{height: `${h}%`}} />
                </div>
                <div className="text-xs text-slate-400 font-semibold">{d.day}</div>
              </div>
            );
          })}
        </div>
        <div className="text-[10px] text-slate-600 mt-3 text-center">Objectif {goal.kcal} kcal/jour</div>
      </div>

      <div className="mx-5 grid grid-cols-3 gap-3">
        {[
          ['Protéines', days.reduce((s,d) => s + d.totals.p, 0) / days.length, goal.p, 'emerald'],
          ['Glucides', days.reduce((s,d) => s + d.totals.c, 0) / days.length, goal.c, 'amber'],
          ['Lipides', days.reduce((s,d) => s + d.totals.f, 0) / days.length, goal.f, 'rose'],
        ].map(([label, v, max, color]) => (
          <div key={label} className="bg-white/5 border border-white/10 rounded-2xl p-4">
            <div className="text-xs text-slate-400 mb-1">{label}</div>
            <div className={`text-xl font-black text-${color}-400`}>{Math.round(v)}<span className="text-xs text-slate-500 font-medium">/{max}g</span></div>
          </div>
        ))}
      </div>
    </div>
  );
};

const ShoppingTab = ({ profile, dailyOverride, shoppingChecked, setShoppingChecked }) => {
  const [days, setDays] = useState(3);
  const { list, totalCost } = useMemo(() => {
    const now = new Date();
    const agg = {};
    let cost = 0;
    for (let i = 0; i < days; i++) {
      const d = new Date(now); d.setDate(d.getDate() + i);
      const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const recipes = dailyOverride[k] || pickDailyRecipes(profile, k);
      recipes.forEach(r => {
        cost += costOf(r);
        r.ingredients.forEach(([name, qty, unit, cat]) => {
          const key = `${name}|${unit}|${cat}`;
          agg[key] = agg[key] || { name, unit, cat, qty: 0 };
          agg[key].qty += parseFloat(qty);
        });
      });
    }
    const grouped = {};
    Object.values(agg).forEach(item => {
      grouped[item.cat] = grouped[item.cat] || [];
      grouped[item.cat].push(item);
    });
    Object.values(grouped).forEach(arr => arr.sort((a,b) => a.name.localeCompare(b.name)));
    return { list: grouped, totalCost: cost };
  }, [profile, dailyOverride, days]);

  const toggle = (key) => setShoppingChecked({...shoppingChecked, [key]: !shoppingChecked[key]});

  const totalItems = Object.values(list).flat().length;
  const checkedItems = Object.values(list).flat().filter(i => shoppingChecked[`${i.name}|${i.unit}|${i.cat}`]).length;

  const CAT_EMOJI = { 'Frais':'🥩', 'Légumes':'🥬', 'Fruits':'🍎', 'Épicerie':'🥫', 'Céréales':'🌾', 'Boulangerie':'🥖', 'Surgelés':'❄️', 'Suppléments':'💊' };

  return (
    <div>
      <div className="px-5 pt-8 pb-4">
        <h1 className="text-3xl font-black text-white tracking-tight">Courses</h1>
        <p className="text-slate-400 text-sm">{checkedItems}/{totalItems} ingrédients · ≈ <span className="text-orange-400 font-semibold">{totalCost.toFixed(2)}€</span></p>
      </div>

      <div className="px-5 mb-4 flex gap-2">
        {[1, 3, 7].map(d => (
          <button key={d} onClick={() => setDays(d)}
            className={`flex-1 py-2.5 rounded-2xl text-sm font-semibold transition border ${days === d ? 'bg-gradient-to-br from-orange-500 to-amber-500 text-white border-transparent' : 'bg-white/5 text-slate-300 border-white/10'}`}>
            {d === 1 ? 'Aujourd\'hui' : d === 3 ? '3 jours' : '1 semaine'}
          </button>
        ))}
      </div>

      <div className="px-5 space-y-4">
        {Object.entries(list).map(([cat, items]) => (
          <div key={cat} className="bg-white/5 border border-white/10 rounded-3xl p-4">
            <div className="flex items-center gap-2 mb-3">
              <span className="text-xl">{CAT_EMOJI[cat] || '🛒'}</span>
              <h3 className="font-bold text-white">{cat}</h3>
              <span className="text-xs text-slate-500">({items.length})</span>
            </div>
            <div className="space-y-1">
              {items.map(item => {
                const key = `${item.name}|${item.unit}|${item.cat}`;
                const checked = shoppingChecked[key];
                return (
                  <button key={key} onClick={() => toggle(key)}
                    className={`w-full flex items-center gap-3 py-2.5 px-2 rounded-xl transition ${checked ? 'opacity-40' : ''}`}>
                    <span className={`w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 ${checked ? 'bg-emerald-500 border-emerald-500' : 'border-white/20'}`}>
                      {checked && <span className="text-white text-xs">✓</span>}
                    </span>
                    <span className={`flex-1 text-left text-sm ${checked ? 'text-slate-500 line-through' : 'text-slate-200'}`}>{item.name}</span>
                    <span className="text-xs text-slate-400 font-mono">{Math.round(item.qty * 10) / 10} {item.unit}</span>
                  </button>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

/* ============================================================
   TAB BAR — LIQUID GLASS avec drag gesture (iOS 26 style)
   - Tap court = changement direct
   - Press + slide horizontal = la pill suit le doigt
   - Au release : snap (avec ressort) sur l'onglet le plus proche
============================================================ */
const TabBar = ({ tab, setTab }) => {
  const tabs = [
    { id: 'today', icon: '🍽', label: 'Aujourd\'hui' },
    { id: 'macros', icon: '📊', label: 'Macros' },
    { id: 'shop', icon: '🛒', label: 'Courses' },
    { id: 'profile', icon: '👤', label: 'Profil' },
  ];
  const activeIdx = tabs.findIndex(t => t.id === tab);
  const containerRef = useRef(null);
  // drag = { x, idx, width } pendant l'interaction, null sinon
  const [drag, setDrag] = useState(null);

  const PADDING = 6; // padding interne en px (top-1.5 / bottom-1.5 / 6px sur les côtés)

  const computeIdx = (xRel, width) => {
    const usable = width - 2 * PADDING;
    const tabW = usable / tabs.length;
    const xInside = xRel - PADDING;
    return Math.max(0, Math.min(tabs.length - 1, Math.floor(xInside / tabW)));
  };

  const onPointerDown = (e) => {
    if (!containerRef.current) return;
    const rect = containerRef.current.getBoundingClientRect();
    const x = e.clientX - rect.left;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    setDrag({ x, idx: computeIdx(x, rect.width), width: rect.width });
  };

  const onPointerMove = (e) => {
    if (!drag || !containerRef.current) return;
    const rect = containerRef.current.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
    setDrag({ x, idx: computeIdx(x, rect.width), width: rect.width });
  };

  const finishDrag = () => {
    if (!drag) return;
    const newIdx = drag.idx;
    setDrag(null);
    if (newIdx !== activeIdx) setTab(tabs[newIdx].id);
  };

  // Position de la pill : centrée sur le doigt en drag, sinon snap sur l'onglet actif
  let pillStyle;
  if (drag) {
    const usable = drag.width - 2 * PADDING;
    const pillW = usable / tabs.length;
    const centered = drag.x - pillW / 2;
    const left = Math.max(PADDING, Math.min(drag.width - pillW - PADDING, centered));
    pillStyle = {
      width: `${pillW}px`,
      left: `${left}px`,
      transition: 'transform 0.15s ease-out, background 0.15s ease-out, box-shadow 0.15s ease-out',
    };
  } else {
    pillStyle = {
      width: `calc((100% - ${PADDING * 2}px) / ${tabs.length})`,
      left: `calc(${PADDING}px + (100% - ${PADDING * 2}px) / ${tabs.length} * ${activeIdx})`,
      // Easing avec léger overshoot (ressort) pour le snap
      transition: 'left 0.45s cubic-bezier(0.34, 1.45, 0.64, 1), width 0.45s cubic-bezier(0.34, 1.45, 0.64, 1), transform 0.25s cubic-bezier(0.32, 0.72, 0.24, 1), background 0.25s ease, box-shadow 0.25s ease',
    };
  }

  // Onglet visuellement actif : suit le doigt en drag, sinon = activeIdx
  const displayIdx = drag ? drag.idx : activeIdx;

  return (
    <div className="fixed bottom-0 left-0 right-0 z-50 px-3" style={{paddingBottom: 'calc(env(safe-area-inset-bottom) + 12px)', paddingTop: '12px'}}>
      <div
        ref={containerRef}
        className="liquid-glass relative mx-auto max-w-md select-none"
        style={{ touchAction: 'none' }}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={finishDrag}
        onPointerCancel={finishDrag}
        onPointerLeave={(e) => { if (drag && e.buttons === 0) finishDrag(); }}
      >
        {/* Pill flottante */}
        <div
          className={`glass-pill absolute top-1.5 bottom-1.5 rounded-2xl ${drag ? 'grabbed' : ''}`}
          style={pillStyle}
        />
        <div className="relative flex pointer-events-none">
          {tabs.map((t, i) => (
            <div key={t.id}
              className={`relative flex-1 py-3 flex flex-col items-center gap-0.5 z-10 transition-colors duration-200 ${displayIdx === i ? 'text-white' : 'text-slate-400'}`}>
              <span className="text-2xl leading-none" style={{filter: displayIdx === i ? 'drop-shadow(0 1px 2px rgba(0,0,0,0.3))' : 'none'}}>{t.icon}</span>
              <span className="text-[10px] font-semibold tracking-wide">{t.label}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
