============================================================ */
const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};

const seededRandom = (seed) => {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return () => { h = (h * 16807) % 2147483647; return h / 2147483647; };
};

const calcMacros = (profile) => {
  const { sex, age, weight, height, activity, goalSurplus } = profile;
  const bmr = sex === 'M'
    ? 10 * weight + 6.25 * height - 5 * age + 5
    : 10 * weight + 6.25 * height - 5 * age - 161;
  const factor = ACTIVITY_LEVELS.find(a => a.id === activity)?.factor || 1.55;
  const tdee = bmr * factor;
  const target = Math.round(tdee + (goalSurplus || 400));
  const protein = Math.round(weight * 2);   // 2 g/kg
  const fat = Math.round(weight * 1);       // 1 g/kg
  const carbs = Math.round((target - protein * 4 - fat * 9) / 4);
  return { kcal: target, p: protein, c: carbs, f: fat, bmr: Math.round(bmr), tdee: Math.round(tdee) };
};

const filterRecipes = (profile) => {
  const blockedAllergens = (profile.allergies || [])
    .map(id => ALLERGEN_OPTIONS.find(a => a.id === id))
    .filter(Boolean)
    .flatMap(a => a.match.map(s => s.toLowerCase()));
  return RECIPE_POOL.filter(r => {
    const text = r.ingredients.map(i => i[0].toLowerCase()).join(' ');
    if (blockedAllergens.some(b => text.includes(b))) return false;
    if (profile.diet === 'vegetarian' && /poulet|bœuf|jambon|bacon|lardons|saumon|poisson/i.test(text)) return false;
    if (profile.diet === 'vegan' && /poulet|bœuf|jambon|bacon|lardons|saumon|œuf|fromage|lait|beurre|mozza|cheddar|whey|miel|yaourt/i.test(text)) return false;
    if (profile.diet === 'pescetarian' && /poulet|bœuf|jambon|bacon|lardons/i.test(text)) return false;
    return true;
  });
};

const pickDailyRecipes = (profile, dateKey) => {
  const candidates = filterRecipes(profile);
  const rand = seededRandom(dateKey + (profile.weight || ''));
  const pickFromMeal = (meal, n=1) => {
    const pool = candidates.filter(r => r.meal === meal);
    const picked = [];
    const used = new Set();
    while (picked.length < n && picked.length < pool.length) {
      const idx = Math.floor(rand() * pool.length);
      if (!used.has(idx)) { used.add(idx); picked.push(pool[idx]); }
    }
    return picked;
  };
  return [
    ...pickFromMeal('breakfast', 1),
    ...pickFromMeal('lunch', 1),
    ...pickFromMeal('snack', 1),
    ...pickFromMeal('dinner', 1),
  ];
};

/* ============================================================
   STORAGE HOOK
============================================================ */
const useStored = (key, initial) => {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : initial; }
    catch { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }, [key, val]);
  return [val, setVal];
};

============================================================ */

const NumberField = ({ label, value, onChange, unit, min=0, max=999, step=1 }) => (
  <div className="mb-5">
    <div className="flex justify-between mb-2">
      <span className="text-slate-300 font-semibold">{label}</span>
      <span className="text-orange-400 font-bold">{value} {unit}</span>
    </div>
    <input type="range" min={min} max={max} step={step} value={value}
      onChange={e => onChange(Number(e.target.value))}
      className="w-full accent-orange-500" />
  </div>
);

/* ============================================================
   MAIN APP
============================================================ */
const App = () => {
  const [profile, setProfile] = useStored('massup_profile', null);
  const [tab, setTab] = useState('today');
  const [consumed, setConsumed] = useStored('massup_consumed', {});
  const [shoppingChecked, setShoppingChecked] = useStored('massup_shopping_checked', {});
  const [dailyOverride, setDailyOverride] = useStored('massup_daily', {});
  const [apiKey, setApiKey] = useStored('massup_api_key', '');
  const [aiRecipesByDate, setAiRecipesByDate] = useStored('massup_ai_recipes', {});

  if (!profile) return <Onboarding onComplete={setProfile} />;

  const date = todayKey();
  const recipes = aiRecipesByDate[date] || dailyOverride[date] || pickDailyRecipes(profile, date);
  const eaten = consumed[date] || [];

  const dailyTotals = recipes
    .filter(r => eaten.includes(r.id))
    .reduce((acc, r) => ({
      kcal: acc.kcal + r.kcal, p: acc.p + r.p, c: acc.c + r.c, f: acc.f + r.f
    }), { kcal: 0, p: 0, c: 0, f: 0 });

  const toggleEaten = (id) => {
    const arr = consumed[date] || [];
    const next = arr.includes(id) ? arr.filter(x => x !== id) : [...arr, id];
    setConsumed({ ...consumed, [date]: next });
  };

  const regenerate = () => {
    const seed = `${date}-${Date.now()}`;
    setDailyOverride({ ...dailyOverride, [date]: pickDailyRecipes(profile, seed) });
  };

  return (
    <div className="min-h-screen flex flex-col bg-slate-950">
      <div className="flex-1 pb-24">
        {tab === 'today' && <TodayTab profile={profile} recipes={recipes} eaten={eaten} dailyTotals={dailyTotals} toggleEaten={toggleEaten} regenerate={regenerate} />}
        {tab === 'macros' && <MacrosTab profile={profile} consumed={consumed} dailyOverride={dailyOverride} />}
        {tab === 'shop' && <ShoppingTab profile={profile} dailyOverride={dailyOverride} shoppingChecked={shoppingChecked} setShoppingChecked={setShoppingChecked} />}
        {tab === 'profile' && <ProfileTab profile={profile} setProfile={setProfile} apiKey={apiKey} setApiKey={setApiKey} />}
      </div>
      <TabBar tab={tab} setTab={setTab} />
    </div>
  );
};

/* ============================================================
   MACROS TAB
============================================================ */
const MacrosTab = ({ profile, consumed, dailyOverride }) => {
  const goal = profile.macros;
  const days = useMemo(() => {
    const arr = [];
    const now = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now); d.setDate(d.getDate() - i);
      const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const recipes = dailyOverride[k] || pickDailyRecipes(profile, k);
      const eaten = consumed[k] || [];
      const totals = recipes.filter(r => eaten.includes(r.id)).reduce((a,r) => ({
        kcal: a.kcal + r.kcal, p: a.p + r.p, c: a.c + r.c, f: a.f + r.f
      }), { kcal:0, p:0, c:0, f:0 });
      arr.push({ key: k, day: ['D','L','M','M','J','V','S'][d.getDay()], totals });
    }
    return arr;
  }, [profile, consumed, dailyOverride]);

  const max = Math.max(goal.kcal, ...days.map(d => d.totals.kcal));
  const avg = Math.round(days.reduce((s,d) => s + d.totals.kcal, 0) / days.length);

  return (
    <div className="fade-in">
      <div className="px-5 pt-8 pb-4">
        <h1 className="text-3xl font-black text-white">Suivi macros</h1>
        <p className="text-slate-400 text-sm">7 derniers jours</p>
      </div>

      <div className="mx-5 mb-5 bg-slate-900 rounded-3xl p-5 border border-slate-800">
        <div className="flex justify-between items-end mb-4">
          <div>
            <div className="text-xs text-slate-400">Moyenne 7j</div>
            <div className="text-2xl font-black text-white">{avg} <span className="text-sm text-slate-500 font-medium">/ {goal.kcal} kcal</span></div>
          </div>
          <div className={`text-sm font-semibold ${avg >= goal.kcal * 0.95 ? 'text-emerald-400' : 'text-amber-400'}`}>
            {avg >= goal.kcal * 0.95 ? '✓ Sur la bonne voie' : '⚠ En dessous'}
          </div>
        </div>
        <div className="flex items-end justify-between h-40 gap-2">
          {days.map(d => {
            const h = max ? (d.totals.kcal / max) * 100 : 0;
            const reached = d.totals.kcal >= goal.kcal * 0.9;
            return (
              <div key={d.key} className="flex-1 flex flex-col items-center gap-2">
                <div className="text-[10px] text-slate-500 font-semibold">{d.totals.kcal || ''}</div>
                <div className="w-full bg-slate-800 rounded-lg overflow-hidden flex flex-col justify-end" style={{height: '100%'}}>
                  <div className={`w-full transition-all ${reached ? 'bg-gradient-to-t from-emerald-500 to-emerald-400' : 'bg-gradient-to-t from-orange-500 to-amber-400'}`} style={{height: `${h}%`}} />
                </div>
                <div className="text-xs text-slate-400 font-semibold">{d.day}</div>
              </div>
            );
          })}
        </div>
        <div className="text-[10px] text-slate-600 mt-3 text-center">Ligne pointillée = objectif {goal.kcal} kcal</div>
      </div>

      <div className="mx-5 grid grid-cols-3 gap-3">
        {[
          ['Protéines', days.reduce((s,d) => s + d.totals.p, 0) / days.length, goal.p, 'emerald'],
          ['Glucides', days.reduce((s,d) => s + d.totals.c, 0) / days.length, goal.c, 'amber'],
          ['Lipides', days.reduce((s,d) => s + d.totals.f, 0) / days.length, goal.f, 'rose'],
        ].map(([label, v, max, color]) => (
          <div key={label} className="bg-slate-900 rounded-2xl p-4 border border-slate-800">
            <div className="text-xs text-slate-400 mb-1">{label}</div>
            <div className={`text-xl font-black text-${color}-400`}>{Math.round(v)}<span className="text-xs text-slate-500 font-medium">/{max}g</span></div>
          </div>
        ))}
      </div>
    </div>
  );
};

/* ============================================================
   SHOPPING TAB
============================================================ */
const ShoppingTab = ({ profile, dailyOverride, shoppingChecked, setShoppingChecked }) => {
  const [days, setDays] = useState(3);
  const list = useMemo(() => {
    const now = new Date();
    const agg = {};
    for (let i = 0; i < days; i++) {
      const d = new Date(now); d.setDate(d.getDate() + i);
      const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const recipes = dailyOverride[k] || pickDailyRecipes(profile, k);
      recipes.forEach(r => r.ingredients.forEach(([name, qty, unit, cat]) => {
        const key = `${name}|${unit}|${cat}`;
        agg[key] = agg[key] || { name, unit, cat, qty: 0 };
        agg[key].qty += parseFloat(qty);
      }));
    }
    const grouped = {};
    Object.values(agg).forEach(item => {
      grouped[item.cat] = grouped[item.cat] || [];
      grouped[item.cat].push(item);
    });
    Object.values(grouped).forEach(arr => arr.sort((a,b) => a.name.localeCompare(b.name)));
    return grouped;
  }, [profile, dailyOverride, days]);

  const toggle = (key) => setShoppingChecked({...shoppingChecked, [key]: !shoppingChecked[key]});

  const totalItems = Object.values(list).flat().length;
  const checkedItems = Object.values(list).flat().filter(i => shoppingChecked[`${i.name}|${i.unit}|${i.cat}`]).length;

  const CAT_EMOJI = { 'Frais':'🥩', 'Légumes':'🥬', 'Fruits':'🍎', 'Épicerie':'🥫', 'Céréales':'🌾', 'Boulangerie':'🥖', 'Surgelés':'❄️', 'Suppléments':'💊' };

  return (
    <div className="fade-in">
      <div className="px-5 pt-8 pb-4">
        <h1 className="text-3xl font-black text-white">Courses</h1>
        <p className="text-slate-400 text-sm">{checkedItems}/{totalItems} ingrédients cochés</p>
      </div>

      <div className="px-5 mb-4 flex gap-2">
        {[1, 3, 7].map(d => (
          <button key={d} onClick={() => setDays(d)}
            className={`flex-1 py-2.5 rounded-2xl text-sm font-semibold transition ${days === d ? 'bg-orange-500 text-white' : 'bg-slate-800 text-slate-300'}`}>
            {d === 1 ? 'Aujourd\'hui' : d === 3 ? '3 jours' : '1 semaine'}
          </button>
        ))}
      </div>

      <div className="px-5 space-y-4">
        {Object.entries(list).map(([cat, items]) => (
          <div key={cat} className="bg-slate-900 rounded-3xl p-4 border border-slate-800">
            <div className="flex items-center gap-2 mb-3">
              <span className="text-xl">{CAT_EMOJI[cat] || '🛒'}</span>
              <h3 className="font-bold text-white">{cat}</h3>
              <span className="text-xs text-slate-500">({items.length})</span>
            </div>
            <div className="space-y-1">
              {items.map(item => {
                const key = `${item.name}|${item.unit}|${item.cat}`;
                const checked = shoppingChecked[key];
                return (
                  <button key={key} onClick={() => toggle(key)}
                    className={`w-full flex items-center gap-3 py-2.5 px-2 rounded-xl transition ${checked ? 'opacity-40' : ''}`}>
                    <span className={`w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 ${checked ? 'bg-emerald-500 border-emerald-500' : 'border-slate-600'}`}>
                      {checked && <span className="text-white text-xs">✓</span>}
                    </span>
                    <span className={`flex-1 text-left text-sm ${checked ? 'text-slate-500 line-through' : 'text-slate-200'}`}>{item.name}</span>
                    <span className="text-xs text-slate-400 font-mono">{Math.round(item.qty * 10) / 10} {item.unit}</span>
                  </button>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

/* ============================================================
   PROFILE TAB
============================================================ */
const ProfileTab = ({ profile, setProfile, apiKey, setApiKey }) => {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(profile);
  const [showApiKey, setShowApiKey] = useState(false);

  const save = () => {
    const macros = calcMacros(draft);
    setProfile({ ...draft, macros });
    setEditing(false);
  };

  const reset = () => {
    if (confirm('Réinitialiser toute l\'application ? Tu repartiras du questionnaire.')) {
      localStorage.clear();
      location.reload();
    }
  };

  return (
    <div className="fade-in">
      <div className="px-5 pt-8 pb-4">
        <h1 className="text-3xl font-black text-white">Profil</h1>
        <p className="text-slate-400 text-sm">{profile.name || 'Athlète'} · {profile.macros.kcal} kcal/jour</p>
      </div>

      <div className="mx-5 space-y-3">
        <div className="bg-slate-900 rounded-3xl p-5 border border-slate-800">
          <div className="flex justify-between items-center mb-4">
            <h3 className="font-bold text-white">Tes données</h3>
            {!editing && <button onClick={() => { setDraft(profile); setEditing(true); }} className="text-orange-400 text-sm font-semibold">Modifier</button>}
          </div>
          {editing ? (
            <div className="space-y-3">
              <NumberField label="Poids" unit="kg" value={draft.weight} onChange={v => setDraft({...draft, weight: v})} min={30} max={200} step={0.5} />
              <NumberField label="Taille" unit="cm" value={draft.height} onChange={v => setDraft({...draft, height: v})} min={120} max={220} />
              <NumberField label="Âge" unit="ans" value={draft.age} onChange={v => setDraft({...draft, age: v})} min={14} max={90} />
              <div>
                <p className="text-slate-400 text-sm mb-2">Activité</p>
                <select value={draft.activity} onChange={e => setDraft({...draft, activity: e.target.value})} className="w-full bg-slate-800 rounded-xl p-3 text-white">
                  {ACTIVITY_LEVELS.map(a => <option key={a.id} value={a.id}>{a.label}</option>)}
                </select>
              </div>
              <div>
                <p className="text-slate-400 text-sm mb-2">Surplus prise de masse</p>
                <div className="grid grid-cols-3 gap-2">
                  {[300, 400, 500].map(s => (
                    <button key={s} onClick={() => setDraft({...draft, goalSurplus: s})}
                      className={`py-2.5 rounded-xl text-sm font-semibold ${draft.goalSurplus === s ? 'bg-orange-500 text-white' : 'bg-slate-800 text-slate-300'}`}>
                      +{s} kcal
                    </button>
                  ))}
                </div>
              </div>
              <div className="flex gap-2 pt-2">
                <button onClick={() => setEditing(false)} className="flex-1 py-3 rounded-xl bg-slate-800 text-slate-300 font-semibold">Annuler</button>
                <button onClick={save} className="flex-1 py-3 rounded-xl bg-orange-500 text-white font-semibold">Enregistrer</button>
              </div>
            </div>
          ) : (
            <div className="space-y-2 text-sm">
              <Row k="Poids" v={`${profile.weight} kg`} />
              <Row k="Taille" v={`${profile.height} cm`} />
              <Row k="Âge" v={`${profile.age} ans`} />
              <Row k="Activité" v={ACTIVITY_LEVELS.find(a => a.id === profile.activity)?.label} />
              <Row k="Régime" v={DIET_OPTIONS.find(d => d.id === profile.diet)?.label} />
              <Row k="Allergies" v={profile.allergies.length ? profile.allergies.length + ' actives' : 'Aucune'} />
              <Row k="Surplus" v={`+${profile.goalSurplus} kcal`} />
            </div>
          )}
        </div>

        <div className="bg-slate-900 rounded-3xl p-5 border border-slate-800">
          <h3 className="font-bold text-white mb-3">Objectifs quotidiens</h3>
          <div className="grid grid-cols-2 gap-3">
            <Stat label="Calories" v={profile.macros.kcal} unit="kcal" color="orange" />
            <Stat label="Protéines" v={profile.macros.p} unit="g" color="emerald" />
            <Stat label="Glucides" v={profile.macros.c} unit="g" color="amber" />
            <Stat label="Lipides" v={profile.macros.f} unit="g" color="rose" />
          </div>
        </div>

        <div className="bg-slate-900 rounded-3xl p-5 border border-slate-800">
          <h3 className="font-bold text-white mb-2">Génération IA (avancé)</h3>
          <p className="text-xs text-slate-400 mb-3">Ajoute ta clé Claude API pour générer des recettes 100% uniques chaque jour. Sans clé, l'app utilise un pool de 25+ recettes prise de masse curatées avec rotation intelligente.</p>
          <div className="flex gap-2">
            <input
              type={showApiKey ? 'text' : 'password'}
              value={apiKey} onChange={e => setApiKey(e.target.value)}
              placeholder="sk-ant-…"
              className="flex-1 bg-slate-800 rounded-xl px-3 py-2.5 text-white text-sm" />
            <button onClick={() => setShowApiKey(!showApiKey)} className="px-3 bg-slate-800 rounded-xl text-slate-400 text-sm">{showApiKey ? '🙈' : '👁'}</button>
          </div>
        </div>

        <button onClick={reset} className="w-full py-3 rounded-2xl bg-rose-950 border border-rose-900/50 text-rose-400 font-semibold text-sm">
          Réinitialiser l'application
        </button>

        <div className="text-center text-xs text-slate-600 pt-4 pb-2">
          MassUp v1.0 · Construit pour {profile.name || 'toi'} 💪
        </div>
      </div>
    </div>
  );
};

const Row = ({k, v}) => (
  <div className="flex justify-between"><span className="text-slate-400">{k}</span><span className="text-white font-semibold">{v}</span></div>
);
const Stat = ({label, v, unit, color}) => (
  <div className="bg-slate-800/50 rounded-2xl p-3">
    <div className="text-xs text-slate-400">{label}</div>
    <div className={`text-xl font-black text-${color}-400`}>{v}<span className="text-xs text-slate-500 font-medium"> {unit}</span></div>
  </div>
);

/* ============================================================
   TAB BAR
============================================================ */
const TabBar = ({ tab, setTab }) => {
  const tabs = [
    { id: 'today', icon: '🍽️', label: 'Aujourd\'hui' },
    { id: 'macros', icon: '📊', label: 'Macros' },
    { id: 'shop', icon: '🛒', label: 'Courses' },
    { id: 'profile', icon: '👤', label: 'Profil' },
  ];
  return (
    <div className="fixed bottom-0 left-0 right-0 glass border-t border-slate-800 z-50" style={{paddingBottom: 'env(safe-area-inset-bottom)'}}>
      <div className="flex">
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            className={`flex-1 py-3 flex flex-col items-center gap-0.5 transition ${tab === t.id ? 'text-orange-400' : 'text-slate-500'}`}>
            <span className="text-2xl">{t.icon}</span>
            <span className="text-[10px] font-semibold">{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
};

/* ============================================================
   MOUNT
============================================================ */
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
